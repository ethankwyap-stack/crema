<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" style="color:#F3EBE0"
     role="img" aria-label="Crema">
  <!-- Mark: an espresso seen from directly above — cup rim, crema, surface highlight.
       Ink parts use currentColor, so the lockup inverts for a light background by setting
       `color` on this <svg> or (when inlined) on its parent. The crema itself is always
       gold: it is the one element in the mark that must never take a palette token. -->
  <g>
    <!-- cup rim -->
    <circle cx="52" cy="59" r="30" fill="none" stroke="currentColor" stroke-width="5"/>
    <!-- the crema -->
    <circle cx="52" cy="59" r="21" fill="#E8A33D"/>
    <!-- surface highlight -->
    <path d="M38.9 54.6A17.5 17.5 0 0 1 53.8 43.3" fill="none" stroke="#F7E3BE"
          stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="112" y="78" font-family="Iowan Old Style, Palatino, Georgia, serif"
        font-size="54" font-weight="700" letter-spacing="-1" fill="currentColor">crema</text>
</svg>
