# Secret scan on every push/PR. gitleaks-action is free for personal (non-org) accounts.
# Dependency CVEs are handled by Dependabot (.github/dependabot.yml), so no osv/semgrep job here —
# that keeps this gate green-when-clean and red only on a real secret leak.
name: security
# push only. On pull_request, gitleaks-action asks the API for the PR's commit list, which needs
# pull-requests:read — a scope Dependabot's read-only token wouldn't reliably grant, so every PR
# went red with "Resource not accessible by integration" while the repo was clean. Every PR branch
# here is pushed to this repo, so the push run scans the identical commits and its check shows on
# the PR anyway. ponytail: re-add pull_request only if fork PRs ever become a thing.
on: [push]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 — pinned by SHA so a hijacked tag can't run new code
        with:
          fetch-depth: 0 # full history — deleted secrets persist there
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
