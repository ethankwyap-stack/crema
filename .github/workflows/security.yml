# Secret scan on every push/PR. gitleaks-action is free for personal (non-org) accounts.
# Dependency CVEs are handled by Dependabot (.github/dependabot.yml), so no osv/semgrep job here —
# that keeps this gate green-when-clean and red only on a real secret leak.
name: security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — pinned by SHA so a hijacked tag can't run new code
        with:
          fetch-depth: 0 # full history — deleted secrets persist there
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
