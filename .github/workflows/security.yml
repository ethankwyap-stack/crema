# Runs gitleaks, semgrep, and osv-scanner on every push and PR.
# Note: gitleaks-action needs a free GITLEAKS_LICENSE only if ethankwyap-stack is a GitHub *Organization*
# account (personal accounts don't). If the gitleaks job errors on license, add the secret or drop that job —
# the local `gitleaks git .` in the audit already covers history.
name: security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — deleted secrets persist there
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run semgrep scan --config auto --error
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: -r .
