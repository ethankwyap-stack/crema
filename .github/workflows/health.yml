name: Site health check
# Probes the live site daily and emails ethankw.yap@gmail.com when anything breaks
# (plus a Monday all-clear). Stdlib-only Python, so there is nothing to install.
on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC daily (~8am US Pacific)
  workflow_dispatch:        # "Run workflow" button for an on-demand check
    inputs:
      email:
        description: "Email the result even if everything passes"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — pinned by SHA so a hijacked tag can't run new code
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check the live site
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 health_check.py ${{ inputs.email && '--email' || '' }}
