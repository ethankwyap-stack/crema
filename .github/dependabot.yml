version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a fresh release soak a week before it's proposed (supply-chain guard)
    # security-only would miss the undici bump surfaced in the 2026-07-18 audit; keep version updates on
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
