<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafile — your whole shop, dialed in</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='84' y='52' width='34' height='14' rx='7' fill='%232A1A12'/%3E%3Ccircle cx='56' cy='59' r='36' fill='%232A1A12'/%3E%3Crect x='37' y='45' width='38' height='5.5' rx='2.75' fill='%23FAF4EA'/%3E%3Crect x='37' y='57' width='38' height='5.5' rx='2.75' fill='%23FAF4EA'/%3E%3Crect x='37' y='69' width='25' height='5.5' rx='2.75' fill='%23D9A05B'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand-lockup">
      <svg class="brand-mark" viewBox="0 0 120 120" aria-hidden="true"><rect x="84" y="52" width="34" height="14" rx="7" fill="#2A1A12"/><circle cx="56" cy="59" r="36" fill="#2A1A12"/><rect x="37" y="45" width="38" height="5.5" rx="2.75" fill="#FAF4EA"/><rect x="37" y="57" width="38" height="5.5" rx="2.75" fill="#FAF4EA"/><rect x="37" y="69" width="25" height="5.5" rx="2.75" fill="#D9A05B"/><circle cx="56" cy="104" r="5.5" fill="#C4502F"/></svg>
      <div>
        <div class="brand-name">portafile</div>
        <input id="shopName" class="shop-name" aria-label="Shop name">
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button data-tab="recipes" role="tab" aria-selected="false" class="tab active">Recipes</button>
      <button data-tab="prices" role="tab" aria-selected="false" class="tab">Prices</button>
      <button data-tab="dialin" role="tab" aria-selected="false" class="tab">Dial-in</button>
      <button data-tab="training" role="tab" aria-selected="false" class="tab">Training</button>
      <button data-tab="print" role="tab" aria-selected="false" class="tab">Print</button>
    </nav>
    <div class="top-actions">
      <button id="btnHelp" class="ghost" title="Help">?</button>
      <button id="btnData" class="ghost" title="Backup, restore, reset">Data ▾</button>
    </div>
  </header>

  <main id="view"></main>

  <footer class="foot">
    <span id="footNote">Everything lives in this browser. Export a backup from <strong>Data</strong>.</span>
  </footer>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="printRoot" class="print-root"></div>
<script src="app.js"></script>
</body>
</html>
