<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- tells the browser to render native controls (selects, scrollbars, spinners) dark;
     without it the langSel dropdown and every scrollbar stay light on the Counter palette -->
<meta name="color-scheme" content="dark">
<title>Crema — your whole shop, dialed in</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%2317130F'/%3E%3Ccircle cx='60' cy='60' r='36' fill='none' stroke='%23F3EBE0' stroke-width='6'/%3E%3Ccircle cx='60' cy='60' r='25' fill='%23E8A33D'/%3E%3Cpath d='M44.5 55A21 21 0 0 1 62.3 40.5' fill='none' stroke='%23F7E3BE' stroke-width='5.5' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand-lockup">
      <svg class="brand-mark" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="36" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="60" cy="60" r="25" fill="#E8A33D"/><path d="M44.5 55A21 21 0 0 1 62.3 40.5" fill="none" stroke="#F7E3BE" stroke-width="5.5" stroke-linecap="round"/></svg>
      <div>
        <div class="brand-name">crema</div>
        <input id="shopName" class="shop-name" aria-label="Shop name">
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button data-tab="recipes" role="tab" aria-selected="false" class="tab active">Recipes</button>
      <button data-tab="prices" role="tab" aria-selected="false" class="tab">Prices</button>
      <button data-tab="dialin" role="tab" aria-selected="false" class="tab">Dial-in</button>
      <button data-tab="training" role="tab" aria-selected="false" class="tab">Training</button>
      <button data-tab="print" role="tab" aria-selected="false" class="tab">Print</button>
    </nav>
    <div class="top-actions">
      <select id="langSel" class="ghost" aria-label="Language" title="Language">
        <option value="en">EN</option>
        <option value="pt">PT</option>
      </select>
      <button id="btnHelp" class="ghost" title="Help">?</button>
      <button id="btnData" class="ghost" title="Backup, restore, reset">Data ▾</button>
    </div>
  </header>

  <main id="view"></main>

  <footer class="foot">
    <span id="footNote">Everything lives in this browser. Export a backup from <strong>Data</strong>.</span>
  </footer>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="printRoot" class="print-root"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
